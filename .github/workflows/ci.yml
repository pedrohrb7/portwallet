name: CI

# Runs on pushes to main only. Each job runs only when the code it checks changed;
# changes limited to docs (docs/, *.md, PRD.md) skip the whole pipeline.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      app: ${{ steps.filter.outputs.app }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the commit of v4.0.3, so a moved tag cannot change what runs here.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            backend:
              - *workflow
              - 'backend/**'
            frontend:
              - *workflow
              - 'frontend/**'
            app:
              - *workflow
              - 'backend/**'
              - 'frontend/**'
            docker:
              - *workflow
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'

  backend:
    name: Backend (build e testes)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint, tipos, testes e build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [changes, backend, frontend]
    # Runs when either side changed, as long as the checks that did run passed. A skipped
    # backend or frontend job (nothing changed there) does not block the E2E suite.
    if: >-
      always() &&
      needs.changes.outputs.app == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Built here instead of downloaded from the backend job, which is skipped when only the frontend changed.
      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  docker:
    name: Docker Compose (smoke test)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:7000/actuator/health | grep -q '"status":"UP"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  images:
    name: Imagens (build e push)
    needs: [changes, backend, frontend, e2e, docker]
    # Same rule as the E2E job: run when the app changed, as long as no check that ran failed.
    # Only main publishes, even if the workflow later gains other triggers.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.app == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: portwallet-api
            context: backend
            build_args: ""
          - image: portwallet-web
            context: frontend
            # Public demo: shows the simulated inbox, there is no real e-mail.
            build_args: VITE_DEMO_INBOX=true
    steps:
      - uses: actions/checkout@v7
      # Third-party actions pinned to the commit of their release, like dorny/paths-filter above.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/pedrohrb7/${{ matrix.image }}:latest
            ghcr.io/pedrohrb7/${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/pedrohrb7/portwallet
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy (VPS)
    needs: images
    if: always() && github.ref == 'refs/heads/main' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portwallet.pedrohrb.dev
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The VPS's ED25519 host key (public), pinned so a spoofed host is refused.
          echo '72.60.254.220 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJZIu9jFy2GVohPM/Q240HFzMpD2Y6O17AhagayXGHN' > ~/.ssh/known_hosts
      # The deploy user accepts a single "deploy <service> <image>" command per connection.
      # The API goes first: the web container only proxies to it.
      - name: Deploy API
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deploy@72.60.254.220
          "deploy portwallet_api ghcr.io/pedrohrb7/portwallet-api:${{ github.sha }}"
      - name: Deploy web
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deploy@72.60.254.220
          "deploy portwallet_web ghcr.io/pedrohrb7/portwallet-web:${{ github.sha }}"
