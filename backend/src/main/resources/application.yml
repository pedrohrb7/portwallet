spring:
  application:
    name: portwallet
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:portwallet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

portwallet:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: PT15M

# API docs exist only in the dev and demo profiles (see docs/features/rnf-documentacao-api).
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
    path: /swagger-ui
  paths-to-match: /api/v1/**

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: dev | e2e
portwallet:
  security:
    jwt:
      # INSECURE: development-only secret. Real environments must set JWT_SECRET.
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-0123456789abcdef}

---
spring:
  config:
    activate:
      on-profile: dev | demo
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
