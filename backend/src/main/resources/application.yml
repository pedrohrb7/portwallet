spring:
  application:
    name: portwallet
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:portwallet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

portwallet:
  # Public address of the frontend, used to build the links sent by e-mail.
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: PT15M
  crypto:
    encryption-key: ${PORTWALLET_CRYPTO_ENCRYPTION_KEY:}
    blind-index-key: ${PORTWALLET_CRYPTO_BLIND_INDEX_KEY:}
  mock:
    inbox:
      # Demo inbox (/mock/inbox) where simulated e-mails land. Only in dev, e2e and demo.
      enabled: false

# API docs exist only in the dev and demo profiles (see docs/features/nfr-api-docs).
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
    path: /swagger-ui
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: dev | e2e
portwallet:
  security:
    jwt:
      # INSECURE: development-only secret. Real environments must set JWT_SECRET.
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-0123456789abcdef}
  crypto:
    # INSECURE: development-only keys. Real environments must set the PORTWALLET_CRYPTO_* variables.
    encryption-key: ${PORTWALLET_CRYPTO_ENCRYPTION_KEY:xAKgggRwSyj3FKLfZkTXmgehp5CGm4ivSjaqAEKkUk0=}
    blind-index-key: ${PORTWALLET_CRYPTO_BLIND_INDEX_KEY:g3Q6MlGpMWJKFikY6uXcA0I0anBiZCEZq/myTN8R/2g=}

---
spring:
  config:
    activate:
      on-profile: dev | e2e | demo
portwallet:
  mock:
    inbox:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev | demo
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
