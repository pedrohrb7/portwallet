# Auth
auth.register.accepted=Se os dados estiverem corretos, você receberá um e-mail para ativar a conta.

# E-mails. confirmation: {0} first name, {1} full name, {2} masked CPF, {3} link
email.confirmation.subject=Ative sua conta PortWallet
email.confirmation.body=Olá, {0}!\n\
\n\
Recebemos um cadastro na PortWallet com estes dados:\n\
\n\
Nome: {1}\n\
CPF: {2}\n\
\n\
Se os dados estão corretos, acesse o link abaixo para criar sua senha e ativar a conta. Ele vale por 24 horas e só pode ser usado uma vez.\n\
\n\
{3}\n\
\n\
Se os dados não são os seus, não use este link: faça o cadastro de novo, e só o link mais recente vai funcionar.\n\
\n\
Se você não pediu este cadastro, ignore este e-mail.
# registration-attempt: {0} first name, {1} login link
email.registration-attempt.subject=Tentativa de cadastro com os seus dados
email.registration-attempt.body=Olá, {0}!\n\
\n\
Alguém tentou criar uma conta PortWallet usando os seus dados. Nenhuma conta nova foi criada.\n\
\n\
Se foi você, entre com a sua conta existente: {1}\n\
\n\
Se não foi você, nenhuma ação é necessária.
