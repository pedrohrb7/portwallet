auth.register.accepted=If the details are correct, you will receive an e-mail to activate your account.

email.confirmation.subject=Activate your PortWallet account
email.confirmation.body=Hello, {0}!\n\
\n\
We received a PortWallet registration with these details:\n\
\n\
Name: {1}\n\
CPF: {2}\n\
\n\
If the details are correct, open the link below to create your password and activate your account. It is valid for 24 hours and can only be used once.\n\
\n\
{3}\n\
\n\
If these details are not yours, do not use this link: register again, and only the newest link will work.\n\
\n\
If you did not request this registration, ignore this e-mail.
email.account-activated.subject=Your PortWallet account is active
email.account-activated.body=Hello, {0}!\n\
\n\
Your PortWallet account has been activated and your wallet is open.\n\
\n\
Sign in with this e-mail and the password you just created: {1}\n\
\n\
If you did not activate the account, someone may have access to your e-mail. Change the password of your e-mail.
email.registration-attempt.subject=Registration attempt with your details
email.registration-attempt.body=Hello, {0}!\n\
\n\
Someone tried to create a PortWallet account using your details. No new account was created.\n\
\n\
If it was you, sign in with your existing account: {1}\n\
\n\
If it was not you, no action is needed.
