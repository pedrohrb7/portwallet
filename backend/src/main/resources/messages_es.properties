email.confirmation.subject=Activa tu cuenta PortWallet
email.confirmation.body=¡Hola, {0}!\n\
\n\
Recibimos un registro en PortWallet con estos datos:\n\
\n\
Nombre: {1}\n\
CPF: {2}\n\
\n\
Si los datos son correctos, abre el siguiente enlace para crear tu contraseña y activar la cuenta. Es válido durante 24 horas y solo se puede usar una vez.\n\
\n\
{3}\n\
\n\
Si los datos no son tuyos, no uses este enlace: regístrate de nuevo y solo funcionará el enlace más reciente.\n\
\n\
Si no solicitaste este registro, ignora este correo.
email.account-activated.subject=Tu cuenta PortWallet está activa
email.account-activated.body=¡Hola, {0}!\n\
\n\
Tu cuenta PortWallet se activó y tu billetera ya está abierta.\n\
\n\
Inicia sesión con este correo electrónico y la contraseña que acabas de crear: {1}\n\
\n\
Si no fuiste tú quien activó la cuenta, alguien puede tener acceso a tu correo electrónico. Cambia la contraseña de tu correo.
email.registration-attempt.subject=Intento de registro con tus datos
email.registration-attempt.body=¡Hola, {0}!\n\
\n\
Alguien intentó crear una cuenta PortWallet con tus datos. No se creó ninguna cuenta nueva.\n\
\n\
Si fuiste tú, inicia sesión con tu cuenta existente: {1}\n\
\n\
Si no fuiste tú, no necesitas hacer nada.
