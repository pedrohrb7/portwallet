auth.register.accepted=Si les informations sont correctes, vous recevrez un e-mail pour activer votre compte.

email.confirmation.subject=Activez votre compte PortWallet
email.confirmation.body=Bonjour {0},\n\
\n\
Nous avons reçu une inscription à PortWallet avec ces informations :\n\
\n\
Nom : {1}\n\
CPF : {2}\n\
\n\
Si les informations sont correctes, ouvrez le lien ci-dessous pour créer votre mot de passe et activer votre compte. Il est valable 24 heures et ne peut être utilisé qu’une seule fois.\n\
\n\
{3}\n\
\n\
Si ces informations ne sont pas les vôtres, n’utilisez pas ce lien : inscrivez-vous à nouveau, et seul le lien le plus récent fonctionnera.\n\
\n\
Si vous n’avez pas demandé cette inscription, ignorez cet e-mail.
email.account-activated.subject=Votre compte PortWallet est actif
email.account-activated.body=Bonjour {0},\n\
\n\
Votre compte PortWallet a été activé et votre portefeuille est ouvert.\n\
\n\
Connectez-vous avec cet e-mail et le mot de passe que vous venez de créer : {1}\n\
\n\
Si ce n’est pas vous qui avez activé le compte, quelqu’un a peut-être accès à votre e-mail. Changez le mot de passe de votre e-mail.
email.registration-attempt.subject=Tentative d’inscription avec vos informations
email.registration-attempt.body=Bonjour {0},\n\
\n\
Quelqu’un a essayé de créer un compte PortWallet avec vos informations. Aucun nouveau compte n’a été créé.\n\
\n\
Si c’était vous, connectez-vous avec votre compte existant : {1}\n\
\n\
Si ce n’était pas vous, aucune action n’est nécessaire.
