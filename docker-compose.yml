services:
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      # INSECURE demo default, so the project runs with no setup. Override JWT_SECRET anywhere else.
      JWT_SECRET: ${JWT_SECRET:-demo-only-insecure-jwt-secret-0123456789abcdef}
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
